plugins {
    alias(libs.plugins.android.application)
}

// CleverTap credentials are never committed. Put them in gradle.properties (git-ignored
// values are fine too, e.g. ~/.gradle/gradle.properties) as:
//   CLEVERTAP_ACCOUNT_ID=XXX-XXX-XXXZ
//   CLEVERTAP_TOKEN=xxx-xxx
//   CLEVERTAP_REGION=eu1        (eu1 | in1 | sg1 | us1 | aps3 | mec1, blank = default)
def ctAccountId = (project.findProperty("CLEVERTAP_ACCOUNT_ID") ?: "").toString()
def ctToken = (project.findProperty("CLEVERTAP_TOKEN") ?: "").toString()
def ctRegion = (project.findProperty("CLEVERTAP_REGION") ?: "").toString()

// The event the marketer targets the Native Display campaign at. Kept in one place so the
// app code and the dashboard campaign can never drift apart.
def ctTriggerEvent = (project.findProperty("CLEVERTAP_STORY_TRIGGER_EVENT") ?: "Home Screen Viewed").toString()

android {
    namespace 'com.example.instastylepe'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.example.instastylepe"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        manifestPlaceholders = [
                clevertapAccountId: ctAccountId,
                clevertapToken    : ctToken,
                clevertapRegion   : ctRegion
        ]

        buildConfigField "String", "CLEVERTAP_ACCOUNT_ID", "\"${ctAccountId}\""
        buildConfigField "String", "STORY_TRIGGER_EVENT", "\"${ctTriggerEvent}\""
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests {
            // The payload parser logs through android.util.Log. Default-valued framework calls
            // let it run on a plain JVM without dragging Robolectric into the demo.
            returnDefaultValues = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.recyclerview

    // Native Display lives in the core CleverTap SDK - no extra artifact needed.
    implementation libs.clevertap.android.sdk

    testImplementation libs.junit
    // Real org.json for JVM unit tests: the mockable android.jar's copy is stubbed out.
    testImplementation libs.json
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
